# SUMO 环境接入示例（道路累计过车数版本，一套模块一个 yaml）
# 说明：
# - 复用 MASDiff 主流程与 sumo_ryl 的 Q / metric / environment 组件
# - 仅把环境替换为“道路累计过车数”版本
# - 使用 testsumo.net.xml / testsumo.rou.xml / testsumo.sumocfg
# - 进化阶段由 EvoX 接管（默认示例为 OpenES）

seed: 42

algorithm:
  M: 100
  N: 1557
  K: 60

logging:
  best_rho_csv_path: "outputs/sumo_ryl_only_astar_nov_best_rho_history.csv"
  initial_population_path: "outputs/sumo_ryl_only_astar_nov_initial_population.pkl"

q_provider:
  class_path: "src.q.sumo_ryl_q:SumoRylQProvider"
  kwargs:
    # ChongQing-114.rou.xml 中 vehicle 数量 = 1557
    num_car: 1557
    cache_path: "outputs/q_sumo_ryl.pt"
    force_recompute: false

environment:
  class_path: "src.environments.sumo_ryl:SumoRylEnvironment"
  kwargs:
    # --- SUMO 基础配置 ---
    sumo_config: "maps/ChongQing-114.sumocfg"
    net_file: "maps/ChongQing-114.net.xml"
    route_file: "maps/ChongQing-114.rou.xml"
    sumo_use_gui: false
    # sumo_binary: "sumo"

    # --- 仿真控制 ---
    end_tick: 600
    update_interval: 6
    sample_interval: 6

    # 模型平时放 CPU；推理时按 policy_device 临时迁移
    move_policies_to_device: false
    policy_device: "cpu"

    # R + 纯Astar 路径规划的奖励影响权重
    reward_astar_weight: 10.0

    # --- 额外 SUMO 参数（可选）---
    extra_sumo_args:
      # - "--seed"
      # - "0"

diffusion_model:
  class_path: "src.diffusion.sumo_ryl_diffusion:SumoRylDiffusionModel"
  kwargs:
    # 生成 R 的形状为 [num_car, num_road]
    num_car: 1557
    device: "cuda"
    sampler: "ddim"
    schedule_type: "cosine"
    num_timesteps: 1000
    inference_steps: 50
    ddim_eta: 0.0
    num_epochs: 50
    batch_size: 32
    lr: 0.0001

evox:
  algorithm:
    class_path: "evox.algorithms:DE"
    kwargs:
      pop_size: 64
      device: "cuda"
  reward_min: 0.0
  reward_max: 5.0
  repo_path: "/mnt/d/evox"
  init_strategy: "best"
  device: "cuda"
  allow_shim_fallback: true

metric:
  class_path: "src.metrics.sumo_ryl_metric:SumoRylMetric"
  kwargs:
    transform: "inv1p"
    eps: 1.0e-8

parallel_executor:
  class_path: "src.parallel.serial:SerialExecutor"
  kwargs: {}

extra:
  note: "sumo_ryl_only_astar_nov 配置示例（道路累计过车数版本，EvoX + OpenES）"
